# Full-Featured Heimdal Configuration

heimdal:
  version: "1"
  repo: "git@github.com:yourusername/dotfiles.git"

# Top-level packages available to all profiles
packages:
  common:
    - git
    - vim
    - tmux
    - curl
    - wget
    - tree
    - fzf
    - ripgrep
  homebrew:
    - neovim
    - gh
    - node
  homebrew_casks:
    - iterm2
    - visual-studio-code
  apt:
    - build-essential
    - python3-pip
  dnf:
    - gcc
    - make
  pacman:
    - base-devel

# Top-level ignore patterns (merged with profile-specific ignores)
ignore:
  - .git
  - .gitignore
  - heimdal.yaml
  - .stowrc
  - "*.md"
  - LICENSE
  - .DS_Store

# Profiles
profiles:
  # Base profile - uses stow-walk mode with tree-folding
  base:
    dotfiles: []  # Empty list = GNU Stow-style walk with tree-folding
    hooks:
      post_apply:
        - command: "echo 'Heimdal setup complete!'"
          description: "Success message"

  # Work profile - explicit dotfile mappings
  work:
    extends: base
    dotfiles:
      # Simple paths (source relative to dotfiles dir, target is ~/source)
      - .vimrc
      - .tmux.conf
      - .zshrc
      
      # Explicit source/target mappings
      - source: vim/vimrc
        target: ~/.vimrc
      - source: zsh/zshrc
        target: ~/.zshrc
      
      # Conditional mappings
      - source: .config/alacritty
        target: ~/.config/alacritty
        when:
          os: [macos, linux]
      - source: .config/wezterm
        target: ~/.config/wezterm
        when:
          profile: [work, personal]
          hostname: "work-*"
    
    packages:
      homebrew:
        - kubectl
        - aws-cli
        - terraform
      homebrew_casks:
        - postman
        - zoom
    
    ignore:
      - "*.swp"
      - "*.swo"
      - "*.tmp"

  # Personal profile with tree-folding
  personal:
    dotfiles: []  # Tree-folding preserves untracked ~/.config entries
    packages:
      homebrew:
        - spotify
      homebrew_casks:
        - discord
        - steam

  # Server profile - minimal
  server:
    dotfiles:
      - .bashrc
      - .vimrc
      - .tmux.conf
    packages:
      common:
        - htop
        - ncdu

# Templates (optional)
templates:
  - src: gitconfig.template
    dest: ~/.gitconfig
    vars:
      email: "you@example.com"
      name: "Your Name"

# History tracking (optional)
history:
  enabled: true
  sync: true
  max_age_days: 90
