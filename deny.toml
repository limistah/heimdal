# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# See .cargo/audit.toml for the justification — quick-xml is pulled in
# transitively via defaults-rs 1.2.2 (latest release), which pins
# `plist = "=1.7.4"` exactly, so no fix is available on our side yet.
#
# RUSTSEC-2025-0119: number_prefix (pulled in by indicatif, for progress-bar
# byte-size formatting) is unmaintained with "no safe upgrade available" per
# the advisory itself — not a vulnerability, and there's nothing to bump to.
ignore = ["RUSTSEC-2026-0195", "RUSTSEC-2026-0194", "RUSTSEC-2025-0119"]

[licenses]
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
# Allow common open source licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "MPL-2.0",  # Mozilla Public License (used by colored, dirs-sys)
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
